[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-pricing-workbench"
version = "0.1.0"
description = "Evaluate a proposed motor insurance pricing change across a synthetic portfolio. All rates are illustrative."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["workbench"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
